<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smartysta</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f0f4f8;
      color: #1e293b;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      background: none;
    }

    header h1 {
      font-size: 42px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 25px;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    /* LISTAVÁLASZTÓ ÓRIÁS MEZŐ */
    .list-selector-area {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    #listSelect {
      flex: 1;
      padding: 25px;
      font-size: 30px;
      font-weight: bold;
      border: 4px solid #cbd5e1;
      border-radius: 20px;
      background-color: white;
      color: #0f172a;
    }

    /* ÓRIÁS BEVITELI MEZŐK */
    .input-area-container {
      background: white;
      padding: 25px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }

    #itemInput {
      width: 100%;
      padding: 30px;
      font-size: 36px;
      font-weight: bold;
      border: 4px solid #cbd5e1;
      border-radius: 20px;
      margin-bottom: 20px;
      color: #0f172a;
    }

    #itemInput:focus, #listSelect:focus {
      border-color: #3b82f6;
      outline: none;
    }

    .details-row-large {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 20px;
    }

    .amount-area-large {
      display: flex;
      gap: 15px;
    }

    #amountInput {
      width: 140px;
      padding: 25px;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      border: 4px solid #cbd5e1;
      border-radius: 20px;
      color: #0f172a;
      background-color: white;
    }

    #unitSelect, #categorySelect {
      flex: 1;
      padding: 25px;
      font-size: 30px;
      font-weight: bold;
      border: 4px solid #cbd5e1;
      border-radius: 20px;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .actions-row {
      display: flex;
      gap: 15px;
    }

    .icon-btn {
      padding: 25px;
      font-size: 32px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .icon-btn.add { background-color: #10b981; color: white; }
    .icon-btn.delete { background-color: #ef4444; color: white; }
    
    .photo-btn {
      flex: 1;
      background-color: #64748b;
      color: white;
      font-weight: bold;
      gap: 10px;
    }
    .photo-btn.has-image {
      background-color: #3b82f6;
    }

    .add-btn {
      flex: 1.5;
      background-color: #3b82f6;
      color: white;
      font-size: 32px;
      font-weight: 800;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #imagePreviewContainer {
      background-color: #e0f2fe;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 28px;
      font-weight: bold;
      color: #0369a1;
    }
    #removeImageBtn {
      background: none;
      border: none;
      font-size: 36px;
      cursor: pointer;
    }

    /* KATEGÓRIA KÁRTYÁK ÉS LISTAELEMEK */
    .category-card {
      background: white;
      border-radius: 30px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .category-title {
      font-size: 34px;
      font-weight: 800;
      padding-bottom: 15px;
      margin-bottom: 20px;
      border-bottom: 4px solid #f1f5f9;
      color: #475569;
    }

    .item-list-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .list-item {
      display: flex;
      align-items: center;
      background: #f8fafc;
      padding: 25px;
      border-radius: 20px;
      gap: 20px;
      border: 2px solid #e2e8f0;
    }

    .checkbox {
      width: 70px;
      height: 70px;
      border: 5px solid #cbd5e1;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 40px;
      color: #10b981;
    }

    .list-item.checked { opacity: 0.5; }
    .list-item.checked .checkbox { background: #e2e8f0; border-color: #cbd5e1; }
    .list-item.checked .item-text { text-decoration: line-through; color: #64748b; }

    .item-text-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .item-text {
      font-size: 36px;
      font-weight: 700;
      word-break: break-word;
      color: #0f172a;
    }

    .unit-badge {
      font-size: 26px;
      font-weight: bold;
      color: #64748b;
      background: #e2e8f0;
      padding: 4px 14px;
      border-radius: 10px;
      width: fit-content;
    }

    .item-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 15px;
      cursor: pointer;
      border: 3px solid #3b82f6;
    }

    .item-actions {
      display: flex;
      gap: 10px;
    }
    .item-actions button {
      padding: 20px;
      font-size: 28px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
    }
    .edit-btn { background: #e2e8f0; color: #475569; }
    .delete-btn { background: #fee2e2; color: #ef4444; }

    .empty-state {
      text-align: center;
      font-size: 30px;
      color: #64748b;
      padding: 40px;
      font-weight: bold;
    }

    .secondary-btn {
      width: 100%;
      padding: 25px;
      font-size: 30px;
      font-weight: bold;
      background: #e2e8f0;
      color: #1e293b;
      border: none;
      border-radius: 20px;
      margin-top: 10px;
      margin-bottom: 50px;
      cursor: pointer;
    }

    /* MODAL ABLAKOK ALAP STÍLUSAI */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.6);
      padding: 20px;
    }

    .modal-content {
      margin: auto;
      display: block;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 20px;
      position: relative;
      top: 50%;
      transform: translateY(-50%);
    }

    .modal-card {
      background: white;
      border-radius: 30px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      margin: auto;
      position: relative;
      top: 50%;
      transform: translateY(-50%);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .modal-card h2 {
      font-size: 36px;
      margin-bottom: 25px;
      color: #0f172a;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 60px;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
      line-height: 1;
    }

    /* KATEGÓRIA KEZELŐ FIX ELRENDEZÉSE */
    .add-cat-form {
      display: flex !important;
      gap: 10px !important;
      margin-bottom: 25px !important;
      width: 100% !important;
      align-items: center !important;
    }
    .add-cat-form #newCatIcon {
      width: 80px !important;
      min-width: 80px !important;
      padding: 15px !important;
      font-size: 26px !important;
      text-align: center !important;
      border: 3px solid #cbd5e1 !important;
      border-radius: 15px !important;
      background-color: white !important;
      color: #0f172a !important;
    }
    .add-cat-form #newCatName {
      flex: 1 !important;
      width: 100% !important;
      padding: 15px !important;
      font-size: 26px !important;
      border: 3px solid #cbd5e1 !important;
      border-radius: 15px !important;
      background-color: white !important;
      color: #0f172a !important;
    }
    .add-cat-form #saveNewCatBtn {
      width: 65px !important;
      min-width: 65px !important;
      height: 65px !important;
      padding: 0 !important;
      font-size: 26px !important;
      flex-shrink: 0 !important;
    }

    #categoryManageList {
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .manage-cat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: #f8fafc;
      border-radius: 15px;
      font-size: 30px;
      font-weight: bold;
      color: #0f172a;
    }
    .delete-cat-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 36px;
      cursor: pointer;
    }

    /* TERMÉK SZERKESZTŐ */
    .edit-form-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .edit-form-container #editItemName, 
    .edit-form-container #editItemCategoryConfig {
      width: 100% !important;
      padding: 25px !important;
      font-size: 32px !important;
      font-weight: bold !important;
      border: 4px solid #cbd5e1 !important;
      border-radius: 20px !important;
      background-color: white !important;
      color: #0f172a !important;
      display: block;
    }
    .edit-amount-row {
      display: flex !important;
      flex-direction: row !important;
      gap: 15px !important;
      width: 100% !important;
    }
    .edit-amount-row #editItemAmount {
      width: 140px !important;
      min-width: 140px !important;
      padding: 25px !important;
      font-size: 32px !important;
      font-weight: bold !important;
      border: 4px solid #cbd5e1 !important;
      border-radius: 20px !important;
      text-align: center;
      background-color: white !important;
      color: #0f172a !important;
    }
    .edit-amount-row #editItemUnit {
      flex: 1 !important;
      width: 100% !important;
      padding: 25px !important;
      font-size: 32px !important;
      font-weight: bold !important;
      border: 4px solid #cbd5e1 !important;
      border-radius: 20px !important;
      background-color: white !important;
      color: #0f172a !important;
      display: block;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>🛒 Smartysta <span id="syncIndicator" style="font-size: 32px; color: #e74c3c;" title="Kapcsolódás..."><i class="fas fa-cloud"></i></span></h1>
    </header>

    <div class="list-selector-area">
      <select id="listSelect"></select>
      <button class="icon-btn add" id="newListBtn" title="Új lista"><i class="fas fa-folder-plus"></i></button>
      <button class="icon-btn delete" id="deleteListBtn" title="Törlés"><i class="fas fa-trash-alt"></i></button>
    </div>

    <div class="input-area-container">
      <input type="text" id="itemInput" placeholder="Új termék..." autocomplete="off">
      
      <div class="details-row-large">
        <div class="amount-area-large">
          <input type="number" id="amountInput" value="1" min="1">
          <select id="unitSelect">
            <option value="db">db</option>
            <option value="kg">kg</option>
            <option value="l">liter</option>
            <option value="csg">csom.</option>
            <option value="üveg">üveg</option>
          </select>
        </div>
        
        <select id="categorySelect"></select>
      </div>
      
      <div class="actions-row">
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <button class="icon-btn photo-btn" id="photoBtn"><i class="fas fa-camera"></i> Kép</button>
        <button class="add-btn" id="addBtn"><i class="fas fa-plus"></i> OK</button>
      </div>
    </div>

    <div id="imagePreviewContainer" style="display: none;">
      <span>📸 Kép megvan!</span>
      <button id="removeImageBtn">❌</button>
    </div>

    <div id="shoppingList"></div>
    
    <button id="manageCatsBtn" class="secondary-btn"><i class="fas fa-tags"></i> Kategóriák</button>
  </div>

  <div id="imageModal" class="modal">
    <span class="modal-close" id="closeImgModal">&times;</span>
    <img class="modal-content" id="modalImg">
  </div>

  <div id="categoryModal" class="modal">
    <div class="modal-card">
      <span class="modal-close" id="closeCatModal">&times;</span>
      <h2>Kategóriák</h2>
      
      <div class="add-cat-form">
        <input type="text" id="newCatIcon" placeholder="🍞">
        <input type="text" id="newCatName" placeholder="Új...">
        <button id="saveNewCatBtn" class="add-btn"><i class="fas fa-plus"></i></button>
      </div>
      
      <div id="categoryManageList"></div>
    </div>
  </div>

  <div id="editItemModal" class="modal">
    <div class="modal-card">
      <span class="modal-close" id="closeEditModal">&times;</span>
      <h2>Szerkesztés</h2>
      
      <div class="edit-form-container">
        <input type="text" id="editItemName">
        
        <div class="edit-amount-row">
          <input type="number" id="editItemAmount" min="1">
          <select id="editItemUnit">
            <option value="db">db</option>
            <option value="kg">kg</option>
            <option value="l">liter</option>
            <option value="csg">csom.</option>
            <option value="üveg">üveg</option>
          </select>
        </div>

        <select id="editItemCategoryConfig"></select>
        
        <div class="edit-photo-area">
          <input type="file" id="editItemImageInput" accept="image/*" style="display: none;">
          <button class="secondary-btn" id="editItemPhotoBtn" style="margin:0;"><i class="fas fa-camera"></i> Új fotó</button>
          <div id="editImagePreview" style="margin-top:15px; display:none; justify-content:space-between; align-items:center; background:#f0f4f8; padding:20px; border-radius:14px;">
            <span>📸 Kép OK!</span>
            <button id="removeEditImageBtn" style="background:none; border:none; font-size:40px;">❌</button>
          </div>
        </div>
        
        <button id="saveEditItemBtn" class="add-btn" style="width:100%; margin-top:25px; padding:30px;"><i class="fas fa-save"></i> Mentés</button>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <script>
    const FIREBASE_DB_URL = "https://smartlysta-default-rtdb.europe-west1.firebasedatabase.app/";

    const itemInput = document.getElementById('itemInput');
    const amountInput = document.getElementById('amountInput');
    const unitSelect = document.getElementById('unitSelect');
    const categorySelect = document.getElementById('categorySelect');
    const imageInput = document.getElementById('imageInput');
    const photoBtn = document.getElementById('photoBtn');
    const addBtn = document.getElementById('addBtn');
    const shoppingList = document.getElementById('shoppingList');
    const listSelect = document.getElementById('listSelect');
    const newListBtn = document.getElementById('newListBtn');
    const deleteListBtn = document.getElementById('deleteListBtn');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const removeImageBtn = document.getElementById('removeImageBtn');
    const syncIndicator = document.getElementById('syncIndicator');

    const imgModal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const closeImgModal = document.getElementById('closeImgModal');
    const catModal = document.getElementById('categoryModal');
    const manageCatsBtn = document.getElementById('manageCatsBtn');
    const closeCatModal = document.getElementById('closeCatModal');
    const categoryManageList = document.getElementById('categoryManageList');
    const newCatIcon = document.getElementById('newCatIcon');
    const newCatName = document.getElementById('newCatName');
    const saveNewCatBtn = document.getElementById('saveNewCatBtn');

    let allLists = { 'Alapértelmezett': [] };
    let currentListName = localStorage.getItem('currentShoppingListName') || 'Alapértelmezett';
    let currentBase64Image = "";
    let editingItemIndex = null;
    let editingBase64Image = "";

    const defaultCategories = {
      'Pékáru': { icon: '🍞' },
      'Tejtermék': { icon: '🥛' },
      'Zöldség-Gyümölcs': { icon: '🍎' },
      'Húsáru': { icon: '🥩' },
      'Szárazáru': { icon: '🍝' },
      'Vegyszer': { icon: '🧼' },
      'Háztartás': { icon: '🧻' },
      'Egyéb': { icon: '❓' }
    };
    let customCategories = defaultCategories;

    function saveAllToCloud() {
      localStorage.setItem('currentShoppingListName', currentListName);
      fetch(`${FIREBASE_DB_URL}data.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lists: allLists, categories: customCategories })
      }).catch(err => console.error("Felhő hiba:", err));
    }

    function startCloudSync() {
      const targetUrl = `${FIREBASE_DB_URL}data.json`;
      const eventSource = new EventSource(targetUrl);

      eventSource.addEventListener('put', function(event) {
        try {
          const response = JSON.parse(event.data);
          if (response && response.data) {
            const remoteData = response.data;
            if (response.path === "/") {
              if (remoteData.lists) allLists = remoteData.lists;
              if (remoteData.categories) customCategories = remoteData.categories;
            } else if (response.path === "/lists") { allLists = remoteData; }
              else if (response.path === "/categories") { customCategories = remoteData; }
            if (!allLists[currentListName]) currentListName = Object.keys(allLists)[0] || 'Alapértelmezett';
            syncIndicator.style.color = "#2ecc71";
            updateCategoryDropdowns();
            updateSelector();
            renderList();
          }
        } catch (e) {}
      });

      eventSource.onmessage = function(event) {
        try {
          const response = JSON.parse(event.data);
          if (response && response.data) {
            const remoteData = response.data;
            if (remoteData.lists) allLists = remoteData.lists;
            if (remoteData.categories) customCategories = remoteData.categories;
            if (!allLists[currentListName]) currentListName = Object.keys(allLists)[0] || 'Alapértelmezett';
            syncIndicator.style.color = "#2ecc71";
            updateCategoryDropdowns();
            updateSelector();
            renderList();
          }
        } catch(err) {}
      };

      eventSource.onerror = function() {
        fetch(targetUrl).then(res => res.json()).then(remoteData => {
          if (remoteData) {
            syncIndicator.style.color = "#2ecc71";
            if (remoteData.lists) allLists = remoteData.lists;
            if (remoteData.categories) customCategories = remoteData.categories;
            updateCategoryDropdowns();
            updateSelector();
            renderList();
          }
        }).catch(() => { syncIndicator.style.color = "#e74c3c"; });
      };
    }

    function updateCategoryDropdowns() {
      categorySelect.innerHTML = '';
      editItemCategoryConfig.innerHTML = '';
      Object.keys(customCategories).forEach(catName => {
        const text = `${customCategories[catName].icon} ${catName}`;
        const option1 = document.createElement('option'); option1.value = catName; option1.textContent = text;
        categorySelect.appendChild(option1);
        const option2 = document.createElement('option'); option2.value = catName; option2.textContent = text;
        editItemCategoryConfig.appendChild(option2);
      });
    }

    function updateSelector() {
      listSelect.innerHTML = '';
      Object.keys(allLists).forEach(name => {
        const option = document.createElement('option'); option.value = name;
        const activeCount = allLists[name] ? allLists[name].filter(item => !item.checked).length : 0;
        option.textContent = name + ` (${activeCount})`;
        if (name === currentListName) option.selected = true;
        listSelect.appendChild(option);
      });
    }

    function renderList() {
      shoppingList.innerHTML = '';
      const items = allLists[currentListName] || [];
      if (items.length === 0) { shoppingList.innerHTML = '<div class="empty-state">Ez a lista még üres.</div>'; return; }
      const groupedItems = {};
      const availableCategories = Object.keys(customCategories);
      const fallbackCategory = availableCategories[0] || 'Egyéb';

      items.forEach((item, originalIndex) => {
        let cat = item.category || fallbackCategory;
        if (!customCategories[cat]) cat = fallbackCategory;
        if (!groupedItems[cat]) groupedItems[cat] = [];
        groupedItems[cat].push({ ...item, originalIndex });
      });

      availableCategories.forEach(categoryName => {
        const categoryGroup = groupedItems[categoryName];
        if (!categoryGroup || categoryGroup.length === 0) return;
        const config = customCategories[categoryName];
        const cardDiv = document.createElement('div'); cardDiv.className = 'category-card';
        cardDiv.innerHTML = `<div class="category-title">${config.icon} ${categoryName}</div>`;
        const listContainer = document.createElement('div'); listContainer.className = 'item-list-container';

        categoryGroup.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = `list-item ${item.checked ? 'checked' : ''}`;
          const imgHtml = item.image ? `<img src="${item.image}" class="item-img">` : '';
          itemDiv.innerHTML = `
            <div class="checkbox">${item.checked ? '<i class="fas fa-check"></i>' : ''}</div>
            <div class="item-text-container"><span class="item-text">${item.name}</span><span class="unit-badge">${item.amount} ${item.unit}</span></div>
            ${imgHtml}
            <div class="item-actions">
              <button class="edit-btn"><i class="fas fa-pencil-alt"></i></button>
              <button class="delete-btn"><i class="fas fa-trash"></i></button>
            </div>
          `;
          itemDiv.querySelectorAll('.checkbox, .item-text-container').forEach(el => {
            el.onclick = () => { allLists[currentListName][item.originalIndex].checked = !allLists[currentListName][item.originalIndex].checked; saveAllToCloud(); };
          });
          if (item.image) { itemDiv.querySelector('.item-img').onclick = () => { imgModal.style.display = "block"; modalImg.src = item.image; }; }
          itemDiv.querySelector('.delete-btn').onclick = () => { allLists[currentListName].splice(item.originalIndex, 1); saveAllToCloud(); };
          itemDiv.querySelector('.edit-btn').onclick = () => { openEditModalWindow(item.originalIndex); };
          listContainer.appendChild(itemDiv);
        });
        cardDiv.appendChild(listContainer); shoppingList.appendChild(cardDiv);
      });
    }

    function openEditModalWindow(index) {
      editingItemIndex = index; const item = allLists[currentListName][index];
      editItemName.value = item.name; editItemAmount.value = item.amount; editItemUnit.value = item.unit;
      editItemCategoryConfig.value = item.category || Object.keys(customCategories)[0] || 'Egyéb';
      editingBase64Image = item.image || "";
      editImagePreview.style.display = editingBase64Image ? 'flex' : 'none';
      editItemModal.style.display = "block";
    }

    saveEditItemBtn.onclick = () => {
      if (editingItemIndex === null) return; const name = editItemName.value.trim(); if (name === "") return;
      allLists[currentListName][editingItemIndex] = { name, amount: editItemAmount.value || "1", unit: editItemUnit.value, category: editItemCategoryConfig.value, image: editingBase64Image, checked: allLists[currentListName][editingItemIndex].checked };
      saveAllToCloud(); editItemModal.style.display = "none"; editingItemIndex = null;
    };

    editItemPhotoBtn.onclick = () => editItemImageInput.click();
    editItemImageInput.onchange = function() {
      const file = this.files[0]; if (file) { const reader = new FileReader(); reader.onload = e => { editingBase64Image = e.target.result; editImagePreview.style.display = 'flex'; }; reader.readAsDataURL(file); }
    };
    removeEditImageBtn.onclick = () => { editingBase64Image = ""; editItemImageInput.value = ""; editImagePreview.style.display = 'none'; };

    function renderManageCategoryList() {
      categoryManageList.innerHTML = '';
      Object.keys(customCategories).forEach(catName => {
        const item = customCategories[catName]; const itemDiv = document.createElement('div'); itemDiv.className = 'manage-cat-item';
        itemDiv.innerHTML = `<span>${item.icon} ${catName}</span><button class="delete-cat-btn" data-name="${catName}"><i class="fas fa-minus-circle"></i></button>`;
        categoryManageList.appendChild(itemDiv);
      });
      document.querySelectorAll('.delete-cat-btn').forEach(btn => {
        btn.onclick = () => {
          const catToDelete = btn.getAttribute('data-name'); const keys = Object.keys(customCategories); if (keys.length <= 1) return;
          const fallback = keys.find(k => k !== catToDelete) || 'Egyéb';
          if (confirm(`Törlöd a(z) "${catToDelete}" kategóriát?`)) { delete customCategories[catToDelete]; saveAllToCloud(); renderManageCategoryList(); }
        };
      });
    }

    saveNewCatBtn.onclick = () => {
      const name = newCatName.value.trim(); const icon = newCatIcon.value.trim() || '📦'; if (name === '' || customCategories[name]) return;
      customCategories[name] = { icon }; newCatName.value = ''; newCatIcon.value = ''; saveAllToCloud(); renderManageCategoryList();
    };

    manageCatsBtn.onclick = () => { catModal.style.display = "block"; renderManageCategoryList(); };
    closeCatModal.onclick = () => catModal.style.display = "none";
    closeImgModal.onclick = () => imgModal.style.display = "none";
    closeEditModal.onclick = () => editItemModal.style.display = "none";
    window.onclick = e => { if (e.target === imgModal) imgModal.style.display = "none"; if (e.target === catModal) catModal.style.display = "none"; if (e.target === editItemModal) editItemModal.style.display = "none"; };

    photoBtn.onclick = () => imageInput.click();
    imageInput.onchange = function() {
      const file = this.files[0]; if (file) { const reader = new FileReader(); reader.onload = e => { currentBase64Image = e.target.result; photoBtn.classList.add('has-image'); imagePreviewContainer.style.display = 'flex'; }; reader.readAsDataURL(file); }
    };
    removeImageBtn.onclick = () => { currentBase64Image = ""; imageInput.value = ""; photoBtn.classList.remove('has-image'); imagePreviewContainer.style.display = 'none'; };

    function addItem() {
      const name = itemInput.value.trim(); const amount = amountInput.value.trim() || "1"; const unit = unitSelect.value; const category = categorySelect.value || Object.keys(customCategories)[0] || 'Egyéb';
      if (name !== '') { if (!allLists[currentListName]) allLists[currentListName] = []; allLists[currentListName].push({ name, amount, unit, category, image: currentBase64Image, checked: false }); itemInput.value = ''; amountInput.value = '1'; currentBase64Image = ""; imageInput.value = ""; photoBtn.classList.remove('has-image'); imagePreviewContainer.style.display = 'none'; saveAllToCloud(); itemInput.focus(); }
    }

    newListBtn.onclick = () => { const name = prompt('Új lista neve:'); if (!name || name.trim() === '') return; const trimmed = name.trim(); if (allLists[trimmed]) return; allLists[trimmed] = []; currentListName = trimmed; saveAllToCloud(); };
    deleteListBtn.onclick = () => { if (Object.keys(allLists).length <= 1) return; if (confirm(`Törlöd a(z) "${currentListName}" listát?`)) { delete allLists[currentListName]; currentListName = Object.keys(allLists)[0]; saveAllToCloud(); } };

    addBtn.onclick = addItem; itemInput.onkeypress = e => { if (e.key === 'Enter') addItem(); };
    listSelect.onchange = () => { currentListName = listSelect.value.split(' (')[0]; localStorage.setItem('currentShoppingListName', currentListName); renderList(); };

    updateCategoryDropdowns(); updateSelector(); renderList(); startCloudSync();
  </script>
</body>
</html>
