<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartysta</title>
    <!-- PWA Manifest összekötés -->
    <link rel="manifest" href="manifest.json">
    <!-- Google Material Icons a letisztult formákhoz -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        /* 1. NEKED: Mély pasztellkék (Muted Slate & Ice Blue) téma */
        .theme-srac {
            --bg-color: #1A2630;       
            --card-bg: #243442;        
            --accent-color: #A9DEF9;         
            --text-main: #E6EEF4;         
            --text-muted: #6C8294;        
            --header-border: rgba(169, 222, 249, 0.15);
            --header-gradient: linear-gradient(180deg, #243442 0%, #1A2630 100%);
            --fab-gradient: linear-gradient(135deg, #A9DEF9 0%, #70C1B3 100%); 
            --fab-plus-color: #1A2630;
            --card-shadow: 0 4px 10px rgba(0,0,0,0.15);
            --status-bar-bg: rgba(0,0,0,0.15);
        }

        /* 2. BRIGINEK: Elegáns világos pasztell-szürke téma hófehér kártyákkal */
        .theme-brigi {
            --bg-color: #E9ECEF;       
            --card-bg: #FFFFFF;        
            --accent-color: #343A40;         
            --text-main: #212529;         
            --text-muted: #868E96;        
            --header-border: rgba(0, 0, 0, 0.06);
            --header-gradient: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, #E9ECEF 100%);
            --fab-gradient: linear-gradient(135deg, #495057 0%, #212529 100%);
            --fab-plus-color: #FFFFFF;
            --card-shadow: 0 6px 16px rgba(0, 0, 0, 0.06); 
            --status-bar-bg: rgba(0,0,0,0.03);
        }

        /* Globális alapok */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            user-select: none;
        }

        body {
            background-color: #0A0D10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Mobil mockup keret a teszteléshez - PWA módban kitölti a kijelzőt */
        .phone-mockup {
            width: 360px;
            height: 740px;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 8px solid #2d353c;
            border-radius: 36px;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Ha valódi PWA-ként telepítik telefonra, eltüntetjük a mockup keretet */
        @media hov (display-mode: standalone), (display-mode: standalone) {
            body { padding: 0; background-color: var(--bg-color); }
            .phone-mockup { width: 100vw; height: 100vh; border: none; border-radius: 0; box-shadow: none; }
        }

        .status-bar {
            height: 24px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            background-color: var(--status-bar-bg);
        }

        .app-header {
            padding: 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--header-border);
            background: var(--header-gradient);
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .menu-icon {
            width: 20px;
            height: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-right: 20px;
            cursor: pointer;
        }

        .menu-icon span {
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
            width: 100%;
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .app-title .brand-suffix {
            color: var(--accent-color);
            font-weight: 800;
        }

        /* Profil / Téma kapcsoló gomb */
        .profile-toggle {
            color: var(--text-main);
            cursor: pointer;
            font-size: 24px;
            background: rgba(255,255,255,0.05);
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--header-border);
        }

        .theme-brigi .profile-toggle {
            background: rgba(0,0,0,0.02);
        }

        .list-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            padding-bottom: 80px;
        }

        .list-card {
            background-color: var(--card-bg);
            border: 1px solid var(--header-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--card-shadow);
            cursor: pointer;
        }

        .list-info {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .item-count {
            color: var(--accent-color);
            margin-left: 6px;
            font-weight: bold;
        }

        .theme-brigi .item-count {
            color: #212529;
        }

        /* Ikon csoportok a jobb szélen */
        .card-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
        }

        .card-actions .material-icons-round {
            font-size: 20px;
            transition: color 0.2s;
        }

        .action-active {
            color: var(--accent-color) !important;
        }

        .theme-srac .action-active {
            color: var(--accent-color) !important;
            text-shadow: 0 0 8px rgba(169, 222, 249, 0.4);
        }

        .theme-brigi .action-active {
            color: #38b000 !important; /* Brigi témájában megnyugtató zöld */
        }

        /* Lebegő plusz gomb */
        .fab-button {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            background: var(--fab-gradient);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .fab-button::before, .fab-button::after {
            content: '';
            position: absolute;
            background-color: var(--fab-plus-color);
            border-radius: 2px;
        }
        .fab-button::before { width: 18px; height: 3px; }
        .fab-button::after { width: 3px; height: 18px; }
    </style>
</head>
<!-- Alapértelmezetten a te mély pasztellkék témáddal indul -->
<body class="theme-srac" id="appBody">

    <div class="phone-mockup">
        <div class="status-bar">
            <span>23:08</span>
            <span>5G / 37%</span>
        </div>

        <div class="app-header">
            <div class="header-left">
                <div class="menu-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="app-title">Smart<span class="brand-suffix">ysta</span></div>
            </div>
            <!-- Profil váltó gomb -->
            <div class="profile-toggle" onclick="toggleTheme()" title="Téma váltása">
                <span class="material-icons-round" id="themeIcon">face</span>
            </div>
        </div>

        <div class="list-container">
            <div class="list-card">
                <div class="list-info">Penny Market <span class="item-count">(3)</span></div>
                <div class="card-actions">
                    <span class="material-icons-round action-active">cloud_done</span>
                    <span class="material-icons-round action-active">vibration</span>
                    <span class="material-icons-round">settings</span>
                </div>
            </div>
            <div class="list-card">
                <div class="list-info">Tesco <span class="item-count">(3)</span></div>
                <div class="card-actions">
                    <span class="material-icons-round action-active">cloud_done</span>
                    <span class="material-icons-round">vibration</span>
                    <span class="material-icons-round">settings</span>
                </div>
            </div>
            <div class="list-card">
                <div class="list-info">Aldi <span class="item-count">(1)</span></div>
                <div class="card-actions">
                    <span class="material-icons-round action-active">cloud_done</span>
                    <span class="material-icons-round action-active">vibration</span>
                    <span class="material-icons-round">settings</span>
                </div>
            </div>
        </div>

        <div class="fab-button"></div>
    </div>

    <script>
        // Téma váltás kezelése logikával
        function toggleTheme() {
            const body = document.getElementById('appBody');
            const icon = document.getElementById('themeIcon');
            
            if (body.classList.contains('theme-srac')) {
                body.classList.remove('theme-srac');
                body.classList.add('theme-brigi');
                icon.textContent = 'face_3'; // Brigi ikonja
            } else {
                body.classList.remove('theme-brigi');
                body.classList.add('theme-srac');
                icon.textContent = 'face'; // A te ikonod
            }
        }

        // PWA Service Worker regisztráció
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker regisztrálva!', reg))
                    .catch(err => console.log('SW regisztráció sikertelen:', err));
            });
        }
    </script>
</body>
</html>
