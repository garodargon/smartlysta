<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smartysta</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* KELLEMES TÜRKIZ ALAP ÉS FINOM ÁTMENET */
    body {
      background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
      background-attachment: fixed;
      color: #f8fafc;
      padding: 15px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* MEGNÖVELT SZÉLESSÉG, HOGY JOBBAN KITÖLTSE A KIJELZŐT */
    .app-container {
      width: 100%;
      max-width: 1000px; /* 600px-ről növelve */
      background: none;
    }

    /* NAGYOBB CÍMSOR */
    header h1 {
      font-size: 54px; /* 44px-ről növelve */
      font-weight: 800;
      text-align: center;
      margin-bottom: 30px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* REZGÉS KAPCSOLÓ GOMB */
    .vibe-toggle-btn {
      background: none;
      border: none;
      font-size: 40px; /* 32px-ről növelve */
      cursor: pointer;
      color: #2dd4bf;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, transform 0.1s;
    }
    .vibe-toggle-btn:active { transform: scale(0.9); }
    .vibe-toggle-btn.muted {
      color: rgba(255, 255, 255, 0.4);
    }

    /* LISTAVÁLASZTÓ MEZŐ - NAGYOBB ÉS SZÉLESEBB */
    .list-selector-area {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    #listSelect {
      flex: 1;
      padding: 25px; /* 22px-ről növelve */
      font-size: 34px; /* 28px-ről növelve */
      font-weight: bold;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #listSelect option {
      background-color: #115e59;
      color: #ffffff;
    }

    /* KONTRASTOS FELSŐ BUBORÉK HÁTTÉR */
    .input-area-container {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 30px; /* Tágasabb belső térköz */
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      margin-bottom: 35px;
    }

    /* NAGYOBB BEVITELI MEZŐ */
    #itemInput {
      width: 100%;
      padding: 28px; /* 25px-ről növelve */
      font-size: 38px; /* 32px-ről növelve */
      font-weight: bold;
      border: 2px solid #ffffff;
      border-radius: 20px;
      margin-bottom: 25px;
      color: #0f172a;
      background-color: #ffffff;
    }
    #itemInput::placeholder {
      color: #94a3b8;
    }

    #itemInput:focus, #listSelect:focus, #amountInput:focus, #unitSelect:focus, #categorySelect:focus {
      border-color: #2dd4bf;
      box-shadow: 0 0 15px rgba(45, 212, 191, 0.5);
      outline: none;
    }

    .details-row-large {
      display: flex;
      flex-direction: column;
      gap: 25px;
      margin-bottom: 25px;
    }

    .amount-area-large {
      display: flex;
      gap: 20px;
    }

    #amountInput {
      width: 160px; /* 130px-ről növelve a nagyobb számok miatt */
      padding: 25px;
      font-size: 34px; /* 28px-ről növelve */
      font-weight: bold;
      text-align: center;
      border: 2px solid #ffffff;
      border-radius: 20px;
      color: #0f172a;
      background-color: #ffffff;
    }

    #unitSelect, #categorySelect {
      flex: 1;
      padding: 25px;
      font-size: 34px; /* 28px-ről növelve */
      font-weight: bold;
      border: 2px solid #ffffff;
      border-radius: 20px;
      background-color: #ffffff;
      color: #0f172a;
    }
    #unitSelect option, #categorySelect option {
      background-color: #ffffff;
      color: #0f172a;
    }

    .actions-row {
      display: flex;
      gap: 20px;
    }

    .icon-btn {
      padding: 25px;
      font-size: 38px; /* 32px-ről növelve */
      border: none;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }
    .icon-btn:active, .add-btn:active, .secondary-btn:active { transform: scale(0.96); }

    .icon-btn.add { background-color: #10b981; color: white; }
    .icon-btn.delete { background-color: #ef4444; color: white; }
    
    /* JOBBAN LÁTHATÓ SÖTÉTKÉK KÉP GOMB */
    .photo-btn {
      flex: 1;
      background-color: #1e3a8a;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 32px; /* Növelt betűméret */
      gap: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .photo-btn.has-image {
      background-color: #06b6d4;
      border-color: #2dd4bf;
    }

    /* STABILOZOTT OK GOMB */
    .add-btn {
      flex: 1.5;
      background-color: #0f766e;
      color: #ffffff;
      font-size: 36px; /* 30px-ről növelve */
      font-weight: 800;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }

    #imagePreviewContainer {
      background-color: rgba(6, 182, 212, 0.2);
      border: 1px solid #2dd4bf;
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 32px; /* 28px-ről növelve */
      font-weight: bold;
      color: #2dd4bf;
    }
    #removeImageBtn {
      background: none;
      border: none;
      font-size: 42px; /* 36px-ről növelve */
      cursor: pointer;
    }

    /* LEHALVÁNYÍTOTT KATEGÓRIA KÁRTYÁK */
    .category-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 30px; /* Tágasabb belső rész */
      margin-bottom: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .category-title {
      font-size: 38px; /* 32px-ről növelve */
      font-weight: 800;
      padding-bottom: 18px;
      margin-bottom: 25px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.85);
    }

    .item-list-container {
      display: flex;
      flex-direction: column;
      gap: 20px; /* Nagyobb távolság az elemek között */
    }

    /* TISZTA FEHÉR LISTAELEMEK SÖTÉT SZÖVEGGEL */
    .list-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 28px; /* 22px-ről növelve, kényelmesebb koppintás */
      border-radius: 24px;
      gap: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .checkbox {
      width: 75px; /* 65px-ről növelve */
      height: 75px;
      border: 4px solid #cbd5e1;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 44px; /* 38px-ről növelve */
      color: #10b981;
    }

    .list-item.checked { opacity: 0.45; background: rgba(255, 255, 255, 0.8); }
    .list-item.checked .checkbox { background: #e2e8f0; border-color: #cbd5e1; }
    .list-item.checked .item-text { text-decoration: line-through; color: #64748b; }

    .item-text-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }

    .item-text {
      font-size: 40px; /* 34px-ről lényegesen növelve az olvashatóságért */
      font-weight: 700;
      word-break: break-word;
      color: #0f172a;
    }

    .unit-badge {
      font-size: 28px; /* 24px-ről növelve */
      font-weight: bold;
      color: #475569;
      background: #f1f5f9;
      padding: 6px 18px;
      border-radius: 12px;
      width: fit-content;
    }

    .item-img {
      width: 110px; /* 90px-ről növelve */
      height: 110px;
      object-fit: cover;
      border-radius: 18px;
      cursor: pointer;
      border: 3px solid #06b6d4;
    }

    .item-actions {
      display: flex;
      gap: 15px;
    }
    .item-actions button {
      padding: 22px;
      font-size: 32px; /* 26px-ről növelve */
      border: none;
      border-radius: 18px;
      cursor: pointer;
    }
    .edit-btn { background: #f1f5f9; color: #475569; }
    .delete-btn { background: #fee2e2; color: #ef4444; }

    .empty-state {
      text-align: center;
      font-size: 34px; /* 28px-ről növelve */
      color: rgba(255, 255, 255, 0.6);
      padding: 50px;
      font-weight: bold;
    }

    /* MENTÉS ÉS VISSZATÖLTÉS PANELSOR */
    .backup-row {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      margin-bottom: 30px;
    }

    .secondary-btn {
      width: 100%;
      padding: 26px;
      font-size: 30px; /* 26px-ről növelve */
      font-weight: bold;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-radius: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    #manageCatsBtn {
      width: 100%;
      margin-bottom: 60px;
    }

    /* MODAL ABLAKOK ALAPBEÁLLÍTÁSAI */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 20px;
      overflow-y: auto;
    }

    /* MODAL MEGNÖVELT SZÉLESSÉGGEL */
    .modal-card {
      background: #ffffff;
      border-radius: 32px;
      padding: 35px;
      width: 100%;
      max-width: 750px; /* 500px-ről növelve, hogy a felugró ablak is szélesebb legyen */
      margin: 40px auto;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      color: #0f172a;
    }

    .modal-card h2 {
      font-size: 40px; /* 34px-ről növelve */
      margin-bottom: 30px;
      color: #0f172a;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 70px; /* 60px-ről növelve */
      font-weight: bold;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1;
    }

    /* KÉPNÉZŐ MODAL STÍLUSAI */
    .modal-content {
      display: block;
      margin: auto;
      max-width: 95%;
      max-height: 85vh;
      border-radius: 16px;
      position: relative;
      top: 50%;
      transform: translateY(-50%);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .add-cat-form #newCatIcon, .add-cat-form #newCatName,
    .edit-form-container #editItemName, .edit-form-container #editItemCategoryConfig,
    .edit-amount-row #editItemAmount, .edit-amount-row #editItemUnit {
      border: 2px solid #cbd5e1 !important;
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }

    .add-cat-form {
      display: flex !important;
      gap: 15px !important;
      margin-bottom: 30px !important;
      width: 100% !important;
      align-items: center !important;
    }
    .add-cat-form #newCatIcon {
      width: 100px !important; /* Nagyobb ikon mező */
      min-width: 100px !important;
      padding: 20px !important;
      font-size: 32px !important;
      text-align: center !important;
      border-radius: 18px !important;
    }
    .add-cat-form #newCatName {
      flex: 1 !important;
      width: 100% !important;
      padding: 20px !important;
      font-size: 32px !important;
      border-radius: 18px !important;
    }
    .add-cat-form #saveNewCatBtn {
      width: 80px !important;
      min-width: 80px !important;
      height: 80px !important;
      padding: 0 !important;
      font-size: 32px !important;
      flex-shrink: 0 !important;
      background-color: #0f766e;
      color: white;
    }

    #categoryManageList {
      max-height: 400px; /* Nagyobb görgethető terület */
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .manage-cat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px;
      background: #f1f5f9;
      border-radius: 18px;
      font-size: 34px; /* 28px-ről növelve */
      font-weight: bold;
      color: #0f172a;
    }
    .delete-cat-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 42px; /* 36px-ről növelve */
      cursor: pointer;
    }

    /* TERMÉK SZERKESZTŐ MODAL BELSEJE */
    .edit-form-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }
    .edit-form-container #editItemName, 
    .edit-form-container #editItemCategoryConfig {
      width: 100% !important;
      padding: 25px !important;
      font-size: 34px !important;
      font-weight: bold !important;
      border-radius: 20px !important;
    }
    .edit-amount-row {
      display: flex !important;
      flex-direction: row !important;
      gap: 15px !important;
      width: 100% !important;
    }
    .edit-amount-row #editItemAmount {
      width: 160px !important;
      min-width: 160px !important;
      padding: 25px !important;
      font-size: 34px !important;
      font-weight: bold !important;
      border-radius: 20px !important;
      text-align: center;
    }
    .edit-amount-row #editItemUnit {
      flex: 1 !important;
      width: 100% !important;
      padding: 25px !important;
      font-size: 34px !important;
      font-weight: bold !important;
      border-radius: 20px !important;
    }
    .edit-form-container .add-btn {
      background-color: #0f766e;
      color: white;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>
        🛒 Smartysta 
        <span id="syncIndicator" style="font-size: 38px; color: #ef4444;" title="Kapcsolódás..."><i class="fas fa-cloud"></i></span>
        <button id="vibeToggleBtn" class="vibe-toggle-btn" title="Rezgések ki/be"><i class="fas fa-volume-up"></i></button>
      </h1>
    </header>

    <div class="list-selector-area">
      <select id="listSelect"></select>
      <button class="icon-btn add" id="newListBtn" title="Új lista"><i class="fas fa-folder-plus"></i></button>
      <button class="icon-btn delete" id="deleteListBtn" title="Törlés"><i class="fas fa-trash-alt"></i></button>
    </div>

    <div class="input-area-container">
      <input type="text" id="itemInput" placeholder="Új termék..." autocomplete="off">
      
      <div class="details-row-large">
        <div class="amount-area-large">
          <input type="number" id="amountInput" value="1" min="1">
          <select id="unitSelect">
            <option value="db">db</option>
            <option value="kg">kg</option>
            <option value="l">liter</option>
            <option value="csg">csom.</option>
            <option value="üveg">üveg</option>
          </select>
        </div>
        
        <select id="categorySelect"></select>
      </div>
      
      <div class="actions-row">
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <button class="icon-btn photo-btn" id="photoBtn"><i class="fas fa-camera"></i> Kép</button>
        <button class="add-btn" id="addBtn"><i class="fas fa-plus"></i> OK</button>
      </div>
    </div>

    <div id="imagePreviewContainer" style="display: none;">
      <span>📸 Kép megvan!</span>
      <button id="removeImageBtn">❌</button>
    </div>

    <div id="shoppingList"></div>
    
    <div class="backup-row">
      <button id="downloadBackupBtn" class="secondary-btn"><i class="fas fa-download"></i> Mentés fájlba</button>
      <input type="file" id="uploadBackupInput" accept=".json" style="display: none;">
      <button id="uploadBackupBtn" class="secondary-btn"><i class="fas fa-upload"></i> Visszatöltés</button>
    </div>

    <button id="manageCatsBtn" class="secondary-btn"><i class="fas fa-tags"></i> Kategóriák kezelése</button>
  </div>

  <div id="imageModal" class="modal">
    <span class="modal-close" id="closeImgModal">&times;</span>
    <img class="modal-content" id="modalImg" alt="Nagyított kép">
  </div>

  <div id="categoryModal" class="modal">
    <div class="modal-card">
      <span class="modal-close" id="closeCatModal">&times;</span>
      <h2>Kategóriák</h2>
      
      <div class="add-cat-form">
        <input type="text" id="newCatIcon" placeholder="🍞">
        <input type="text" id="newCatName" placeholder="Új...">
        <button id="saveNewCatBtn" class="add-btn"><i class="fas fa-plus"></i></button>
      </div>
      
      <div id="categoryManageList"></div>
    </div>
  </div>

  <div id="editItemModal" class="modal">
    <div class="modal-card">
      <span class="modal-close" id="closeEditModal">&times;</span>
      <h2>Szerkesztés</h2>
      
      <div class="edit-form-container">
        <input type="text" id="editItemName">
        
        <div class="edit-amount-row">
          <input type="number" id="editItemAmount" min="1">
          <select id="editItemUnit">
            <option value="db">db</option>
            <option value="kg">kg</option>
            <option value="l">liter</option>
            <option value="csg">csom.</option>
            <option value="üveg">üveg</option>
          </select>
        </div>

        <select id="editItemCategoryConfig"></select>
        
        <div class="edit-photo-area">
          <input type="file" id="editItemImageInput" accept="image/*" style="display: none;">
          <button class="secondary-btn" id="editItemPhotoBtn" style="margin:0; color:#0f172a; border-color:#cbd5e1;"><i class="fas fa-camera"></i> Új fotó</button>
          <div id="editImagePreview" style="margin-top:15px; display:none; justify-content:space-between; align-items:center; background:#f1f5f9; padding:20px; border-radius:14px;">
            <span>📸 Kép OK!</span>
            <button id="removeEditImageBtn" style="background:none; border:none; font-size:40px;">❌</button>
          </div>
        </div>
        
        <button id="saveEditItemBtn" class="add-btn" style="width:100%; margin-top:25px; padding:25px;"><i class="fas fa-save"></i> Mentés</button>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <script>
    const FIREBASE_DB_URL = "https://smartlysta-default-rtdb.europe-west1.firebasedatabase.app/";

    const itemInput = document.getElementById('itemInput');
    const amountInput = document.getElementById('amountInput');
    const unitSelect = document.getElementById('unitSelect');
    const categorySelect = document.getElementById('categorySelect');
    const imageInput = document.getElementById('imageInput');
    const photoBtn = document.getElementById('photoBtn');
    const addBtn = document.getElementById('addBtn');
    const shoppingList = document.getElementById('shoppingList');
    const listSelect = document.getElementById('listSelect');
    const newListBtn = document.getElementById('newListBtn');
    const deleteListBtn = document.getElementById('deleteListBtn');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const removeImageBtn = document.getElementById('removeImageBtn');
    const syncIndicator = document.getElementById('syncIndicator');
    const vibeToggleBtn = document.getElementById('vibeToggleBtn');
    const downloadBackupBtn = document.getElementById('downloadBackupBtn');
    const uploadBackupBtn = document.getElementById('uploadBackupBtn');
    const uploadBackupInput = document.getElementById('uploadBackupInput');

    const imgModal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const closeImgModal = document.getElementById('closeImgModal');
    const catModal = document.getElementById('categoryModal');
    const manageCatsBtn = document.getElementById('manageCatsBtn');
    const closeCatModal = document.getElementById('closeCatModal');
    const categoryManageList = document.getElementById('categoryManageList');
    const newCatIcon = document.getElementById('newCatIcon');
    const newCatName = document.getElementById('newCatName');
    const saveNewCatBtn = document.getElementById('saveNewCatBtn');

    const editItemModal = document.getElementById('editItemModal');
    const editItemName = document.getElementById('editItemName');
    const editItemAmount = document.getElementById('editItemAmount');
    const editItemUnit = document.getElementById('editItemUnit');
    const editItemCategoryConfig = document.getElementById('editItemCategoryConfig');
    const editItemPhotoBtn = document.getElementById('editItemPhotoBtn');
    const editItemImageInput = document.getElementById('editItemImageInput');
    const editImagePreview = document.getElementById('editImagePreview');
    const removeEditImageBtn = document.getElementById('removeEditImageBtn');
    const saveEditItemBtn = document.getElementById('saveEditItemBtn');
    const closeEditModal = document.getElementById('closeEditModal');

    let allLists = { 'Alapértelmezett': [] };
    let currentListName = localStorage.getItem('currentShoppingListName') || 'Alapértelmezett';
    let currentBase64Image = "";
    let editingItemIndex = null;
    let editingBase64Image = "";
    let isLocalAction = false; 

    let isVibrationEnabled = localStorage.getItem('vibrationEnabled') !== 'false';

    const defaultCategories = {
      'Pékáru': { icon: '🍞' },
      'Tejtermék': { icon: '🥛' },
      'Zöldség-Gyümölcs': { icon: '🍎' },
      'Húsáru': { icon: '🥩' },
      'Szárazáru': { icon: '🍝' },
      'Vegyszer': { icon: '🧼' },
      'Háztartás': { icon: '🧻' },
      'Egyéb': { icon: '❓' }
    };
    let customCategories = {};

    function updateVibeToggleButtonUI() {
      if (isVibrationEnabled) {
        vibeToggleBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
        vibeToggleBtn.classList.remove('muted');
      } else {
        vibeToggleBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
        vibeToggleBtn.classList.add('muted');
      }
    }

    vibeToggleBtn.onclick = () => {
      isVibrationEnabled = !isVibrationEnabled;
      localStorage.setItem('vibrationEnabled', isVibrationEnabled);
      updateVibeToggleButtonUI();
      if (isVibrationEnabled && 'vibrate' in navigator) navigator.vibrate(50);
    };

    function triggerLocalVibrate() {
      if (isVibrationEnabled && 'vibrate' in navigator) navigator.vibrate(80); 
    }

    function triggerRemoteUpdateVibrate() {
      if (isVibrationEnabled && 'vibrate' in navigator) navigator.vibrate([100, 100, 100]); 
    }

    function saveAllToCloud() {
      isLocalAction = true; 
      localStorage.setItem('currentShoppingListName', currentListName);
      fetch(`${FIREBASE_DB_URL}data.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lists: allLists, categories: customCategories })
      })
      .then(() => { isLocalAction = false; })
      .catch(err => { console.error("Felhő hiba:", err); isLocalAction = false; });
    }

    function handleRemoteData(remoteData) {
      if (!remoteData) return;
      if (!remoteData.categories || Object.keys(remoteData.categories).length === 0) {
        customCategories = defaultCategories;
        saveAllToCloud();
      } else {
        customCategories = remoteData.categories;
      }
      if (remoteData.lists) allLists = remoteData.lists;
      if (!allLists[currentListName]) currentListName = Object.keys(allLists)[0] || 'Alapértelmezett';

      syncIndicator.style.color = "#2dd4bf";
      updateCategoryDropdowns();
      updateSelector();
      renderList();
    }

    function startCloudSync() {
      const targetUrl = `${FIREBASE_DB_URL}data.json`;
      const eventSource = new EventSource(targetUrl);

      eventSource.addEventListener('put', function(event) {
        try {
          const response = JSON.parse(event.data);
          if (response && response.data) {
            if (!isLocalAction) triggerRemoteUpdateVibrate(); 
            if (response.path === "/") {
              handleRemoteData(response.data);
            } else if (response.path === "/lists") {
              allLists = response.data;
              updateSelector(); renderList();
            } else if (response.path === "/categories") {
              customCategories = response.data || defaultCategories;
              updateCategoryDropdowns(); renderList();
            }
            syncIndicator.style.color = "#2dd4bf";
          }
        } catch (e) {}
      });

      eventSource.onmessage = function(event) {
        try {
          const response = JSON.parse(event.data);
          if (response && response.data) {
            if (!isLocalAction) triggerRemoteUpdateVibrate();
            handleRemoteData(response.data);
          }
        } catch(err) {}
      };

      eventSource.onerror = function() {
        fetch(targetUrl).then(res => res.json()).then(remoteData => {
          if (remoteData) handleRemoteData(remoteData);
        }).catch(() => { syncIndicator.style.color = "#ef4444"; });
      };
    }

    function updateCategoryDropdowns() {
      categorySelect.innerHTML = ''; editItemCategoryConfig.innerHTML = '';
      Object.keys(customCategories).forEach(catName => {
        const text = `${customCategories[catName].icon} ${catName}`;
        const option1 = document.createElement('option'); option1.value = catName; option1.textContent = text;
        categorySelect.appendChild(option1);
        const option2 = document.createElement('option'); option2.value = catName; option2.textContent = text;
        editItemCategoryConfig.appendChild(option2);
      });
    }

    function updateSelector() {
      listSelect.innerHTML = '';
      Object.keys(allLists).forEach(name => {
        const option = document.createElement('option'); option.value = name;
        const activeCount = allLists[name] ? allLists[name].filter(item => !item.checked).length : 0;
        option.textContent = name + ` (${activeCount})`;
        if (name === currentListName) option.selected = true;
        listSelect.appendChild(option);
      });
    }

    function renderList() {
      shoppingList.innerHTML = '';
      const items = allLists[currentListName] || [];
      if (items.length === 0) { shoppingList.innerHTML = '<div class="empty-state">Ez a lista még üres.</div>'; return; }
      const groupedItems = {};
      const availableCategories = Object.keys(customCategories);
      const fallbackCategory = availableCategories[0] || 'Egyéb';

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        let cat = item.category || fallbackCategory;
        if (!customCategories[cat]) cat = fallbackCategory;
        if (!groupedItems[cat]) groupedItems[cat] = [];
        groupedItems[cat].push({ ...item, originalIndex: i });
      }

      availableCategories.forEach(categoryName => {
        const categoryGroup = groupedItems[categoryName];
        if (!categoryGroup || categoryGroup.length === 0) return;
        categoryGroup.sort((a, b) => a.checked - b.checked);

        const config = customCategories[categoryName];
        const cardDiv = document.createElement('div'); cardDiv.className = 'category-card';
        cardDiv.innerHTML = `<div class="category-title">${config.icon} ${categoryName}</div>`;
        const listContainer = document.createElement('div'); listContainer.className = 'item-list-container';

        categoryGroup.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = `list-item ${item.checked
