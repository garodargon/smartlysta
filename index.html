<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smartysta</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* KELLEMES TÜRKIZ ALAP ÉS FINOM ÁTMENET */
    body {
      background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
      background-attachment: fixed;
      color: #f8fafc;
      padding: 15px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      background: none;
    }

    header h1 {
      font-size: 44px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 25px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* REZGÉS KAPCSOLÓ GOMB */
    .vibe-toggle-btn {
      background: none;
      border: none;
      font-size: 32px;
      cursor: pointer;
      color: #2dd4bf;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, transform 0.1s;
    }
    .vibe-toggle-btn:active { transform: scale(0.9); }
    .vibe-toggle-btn.muted {
      color: rgba(255, 255, 255, 0.4);
    }

    /* LISTAVÁLASZTÓ MEZŐ */
    .list-selector-area {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    #listSelect {
      flex: 1;
      padding: 22px;
      font-size: 28px;
      font-weight: bold;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #listSelect option {
      background-color: #115e59;
      color: #ffffff;
    }

    /* VISSZAÁLLÍTOTT VILÁGOSABB BEVITELI MEZŐK */
    .input-area-container {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 25px;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    #itemInput {
      width: 100%;
      padding: 25px;
      font-size: 32px;
      font-weight: bold;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      margin-bottom: 20px;
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.1);
    }
    #itemInput::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    #itemInput:focus, #listSelect:focus, #amountInput:focus, #unitSelect:focus, #categorySelect:focus {
      border-color: #2dd4bf;
      box-shadow: 0 0 15px rgba(45, 212, 191, 0.3);
      outline: none;
    }

    .details-row-large {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 20px;
    }

    .amount-area-large {
      display: flex;
      gap: 15px;
    }

    #amountInput {
      width: 130px;
      padding: 22px;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.1);
    }

    #unitSelect, #categorySelect {
      flex: 1;
      padding: 22px;
      font-size: 28px;
      font-weight: bold;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    #unitSelect option, #categorySelect option {
      background-color: #115e59;
      color: #ffffff;
    }

    .actions-row {
      display: flex;
      gap: 15px;
    }

    .icon-btn {
      padding: 22px;
      font-size: 32px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }
    .icon-btn:active, .add-btn:active, .secondary-btn:active { transform: scale(0.96); }

    .icon-btn.add { background-color: #10b981; color: white; }
    .icon-btn.delete { background-color: #ef4444; color: white; }
    
    .photo-btn {
      flex: 1;
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-weight: bold;
      gap: 10px;
    }
    .photo-btn.has-image {
      background-color: #06b6d4;
      border-color: #2dd4bf;
    }

    .add-btn {
      flex: 1.5;
      background-color: #2dd4bf;
      color: #0f766e;
      font-size: 30px;
      font-weight: 800;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(45, 212, 191, 0.3);
    }

    #imagePreviewContainer {
      background-color: rgba(6, 182, 212, 0.2);
      border: 1px solid #2dd4bf;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 28px;
      font-weight: bold;
      color: #2dd4bf;
    }
    #removeImageBtn {
      background: none;
      border: none;
      font-size: 36px;
      cursor: pointer;
    }

    /* LEHALVÁNYÍTOTT KATEGÓRIA KÁRTYÁK */
    .category-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .category-title {
      font-size: 32px;
      font-weight: 800;
      padding-bottom: 15px;
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.85);
    }

    .item-list-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* TISZTA FEHÉR LISTAELEMEK SÖTÉT SZÖVEGGEL */
    .list-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 22px;
      border-radius: 20px;
      gap: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .checkbox {
      width: 65px;
      height: 65px;
      border: 4px solid #cbd5e1;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 38px;
      color: #10b981;
    }

    .list-item.checked { opacity: 0.45; background: rgba(255, 255, 255, 0.8); }
    .list-item.checked .checkbox { background: #e2e8f0; border-color: #cbd5e1; }
    .list-item.checked .item-text { text-decoration: line-through; color: #64748b; }

    .item-text-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .item-text {
      font-size: 34px;
      font-weight: 700;
      word-break: break-word;
      color: #0f172a;
    }

    .unit-badge {
      font-size: 24px;
      font-weight: bold;
      color: #475569;
      background: #f1f5f9;
      padding: 4px 14px;
      border-radius: 10px;
      width: fit-content;
    }

    .item-img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 15px;
      cursor: pointer;
      border: 3px solid #06b6d4;
    }

    .item-actions {
      display: flex;
      gap: 10px;
    }
    .item-actions button {
      padding: 18px;
      font-size: 26px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
    }
    .edit-btn { background: #f1f5f9; color: #475569; }
    .delete-btn { background: #fee2e2; color: #ef4444; }

    .empty-state {
      text-align: center;
      font-size: 28px;
      color: rgba(255, 255, 255, 0.6);
      padding: 40px;
      font-weight: bold;
    }

    /* MENTÉS ÉS VISSZATÖLTÉS UTOLSÓ VERZIÓ SZERINTI SZEKCIÓ */
    .backup-row {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    .secondary-btn {
      flex: 1;
      padding: 22px;
      font-size: 26px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-radius: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #manageCatsBtn {
      width: 100%;
      margin-bottom: 50px;
    }

    /* MODAL ABLAKOK */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 20px;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 32px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      margin: auto;
      position: relative;
      top: 50%;
      transform: translateY(-50%);
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      color: #0f172a;
    }

    .modal-card h2 {
      font-size: 34px;
      margin-bottom: 25px;
      color: #0f172a;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 60px;
      font-weight: bold;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1;
    }

    .add-cat-form #newCatIcon, .add-cat-form #newCatName,
    .edit-form-container #editItemName, .edit-form-container #editItemCategoryConfig,
    .edit-amount-row #editItemAmount, .edit-amount-row #editItemUnit {
      border: 2px solid #cbd5e1 !important;
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }

    .add-cat-form {
      display: flex !important;
      gap: 10px !important;
      margin-bottom: 25px !important;
      width: 100% !important;
      align-items: center !important;
    }
    .add-cat-form #newCatIcon {
      width: 80px !important;
      min-width: 80px !important;
      padding: 15px !important;
      font-size: 26px !important;
      text-align: center !important;
      border-radius: 15px !important;
    }
    .add-cat-form #newCatName {
      flex: 1 !important;
      width: 100% !important;
      padding: 15px !important;
      font-size: 26px !important;
      border-radius: 15px !important;
    }
    .add-cat-form #saveNewCatBtn {
      width: 65px !important;
      min-width: 65px !important;
      height: 65px !important;
      padding: 0 !important;
      font-size: 26px !important;
      flex-shrink: 0 !important;
      background-color: #0f766e;
      color: white;
    }

      max-height: 300px;
      overflow
